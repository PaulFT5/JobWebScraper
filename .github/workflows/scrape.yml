name: Weekly Job Scrape

on:
  schedule:
    - cron: "0 3 * * 1"   # Monday, 3:00 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run runner
        env:
          EMAIL_ACCOUNT_SENDER: ${{ secrets.EMAIL_ACCOUNT_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_ACCOUNT_RECEIVER: ${{ secrets.EMAIL_ACCOUNT_RECEIVER }}
        run: python -m backend.scraper.bestjobs.runner

      - name: Commit updated database
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/jobs/JobsDatabase.sqlite
          git commit -m "Weekly scrape update" || echo "No changes to commit"
          git pull --rebase origin master
          git push